[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-coding-engineer-core-new"
version = "0.2.0"
description = "A platform-independent software-development agent powered by Claude Code."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "pydantic-settings>=2.3,<3", "typer>=0.16,<1"]

[project.scripts]
autocoding-agent = "autocoding_agent.interfaces.cli:app"
autocoding-agent-ui = "autocoding_agent.interfaces.streamlit_ui:run"

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "ruff>=0.5,<1"]
ui = ["streamlit>=1.37,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls the configured Claude Code model"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["autocoding_agent*"]

[tool.setuptools.package-data]
autocoding_agent = ["skills/*/SKILL.md"]
